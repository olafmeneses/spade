[tox]
envlist = docs, py39, py310, py311, py312, lint
isolated_build = false

[testenv:lint]
skip_install = true
commands =
    posix: sh -c "uv pip install -e .[dev] || pip install -e .[dev]"
    win32: cmd /c "uv pip install -e .[dev] || pip install -e .[dev]"
    ruff check spade
    ruff format --check spade

[testenv:docs]
changedir=docs
setenv =
    LC_ALL=en_US.UTF-8
    LANG=en_US.UTF-8
skip_install = true
commands=
    posix: sh -c "uv pip install -e {toxinidir}[dev] || pip install -e {toxinidir}[dev]"
    win32: cmd /c "uv pip install -e {toxinidir}[dev] || pip install -e {toxinidir}[dev]"
    sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html


[testenv]
setenv =
    PYTHONPATH = {toxinidir}
allowlist_externals =
    uv
    sh
    cmd
skip_install = true
commands =
    posix: sh -c "uv pip install -e .[dev] || pip install -e .[dev]"
    win32: cmd /c "uv pip install -e .[dev] || pip install -e .[dev]"
    pytest --basetemp={envtmpdir} --cov=spade




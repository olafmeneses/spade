# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master, develop ]
    tags:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - name: Set up dependencies
        run: |
          uv sync --extra dev || pip install -e .[dev]
      - name: Lint
        run: |
          uv run tox -e lint || tox -e lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    name: ${{ matrix.os }} / Py ${{ matrix.python }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.15"
    - name: Set up dependencies
      run: |
        uv sync --extra dev || pip install -e .[dev]
    - name: Test with pytest
      run: |
        uv run pytest -q || pytest -q

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    name: ubuntu-latest / Py ${{ matrix.python }} / with coverage

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.15"
    - name: Set up dependencies
      run: |
        uv sync --extra dev || pip install -e .[dev]
    - name: Run coverage
      run: |
        uv run coverage erase || coverage erase
        uv run coverage run --source=spade -m pytest -q || coverage run --source=spade -m pytest -q
        uv run coverage xml -o coverage.xml || coverage xml -o coverage.xml
    - name: Coveralls
      uses: javipalanca/coveralls-python-action@develop
      with:
        parallel: true
        flag-name: Unit Test
    - name: Send coverage report to codecov
      uses: codecov/codecov-action@v5

  coveralls_finish:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true

# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master, develop ]
    tags:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - name: Set up dependencies
        run: |
          uv sync --extra dev || pip install -e .[dev]
      - name: Lint
        run: |
          uv run tox -e lint || tox -e lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    name: ${{ matrix.os }} / Py ${{ matrix.python }}

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}

    - name: Restore global uv cache (Windows only)
      if: runner.os == 'Windows'
      id: cache-restore-windows
      uses: actions/cache/restore@v4
      with:
        path: |
          ~\AppData\Local\uv\cache
          ~\AppData\Roaming\uv
          .venv
        key: uv-windows-latest-py${{ matrix.python }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          uv-windows-latest-py${{ matrix.python }}-

    - name: Install uv (Fast Windows Installation)
      if: runner.os == 'Windows'
      timeout-minutes: 5
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "Downloading and installing UV..."
        irm https://astral.sh/uv/0.8.15/install.ps1 | iex

        # Resolve actual uv.exe location across possible install dirs
        $candidates = @(
          "$env:USERPROFILE\.local\bin",
          "$env:LOCALAPPDATA\Programs\uv",
          "$env:USERPROFILE\AppData\Local\uv\bin"
        )

        $uvExePath = $null
        foreach ($dir in $candidates) {
          $candidateExe = Join-Path $dir "uv.exe"
          if (Test-Path $candidateExe) {
            $uvExePath = $candidateExe
            break
          }
        }

        if (-not $uvExePath) {
          Write-Host "uv.exe not found in standard locations, attempting discovery..."
          $found = Get-ChildItem -Path "$env:USERPROFILE" -Filter "uv.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $uvExePath = $found.FullName
          }
        }

        if (-not $uvExePath) {
          throw "uv.exe could not be located after installation."
        }

        $uvDir = Split-Path -Parent $uvExePath

        # Add to PATH for current session and future steps (GitHub Actions way)
        $env:PATH = "$uvDir;$env:PATH"
        Add-Content -Path $env:GITHUB_PATH -Value $uvDir

        # Verify installation (both absolute path and via PATH)
        Write-Host "Verifying UV installation..."
        & $uvExePath --version
        uv --version
        Write-Host "UV installed and available on PATH"
      shell: powershell

    - name: Install uv (Non-Windows)
      if: runner.os != 'Windows'
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.15"
        enable-cache: true

    - name: Set up dependencies
      run: |
        uv sync --extra dev || pip install -e .[dev]

    - name: Save uv cache (Windows only - if cache miss)
      if: runner.os == 'Windows' && steps.cache-restore-windows.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~\AppData\Local\uv\cache
          ~\AppData\Roaming\uv
          .venv
        key: uv-windows-latest-py${{ matrix.python }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}

    - name: Test with pytest
      run: |
        uv run pytest -q || pytest -q

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    name: ubuntu-latest / Py ${{ matrix.python }} / with coverage

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.15"
    - name: Set up dependencies
      run: |
        uv sync --extra dev || pip install -e .[dev]
    - name: Run coverage
      run: |
        uv run coverage erase || coverage erase
        uv run coverage run --source=spade -m pytest -q || coverage run --source=spade -m pytest -q
        uv run coverage xml -o coverage.xml || coverage xml -o coverage.xml
    - name: Coveralls
      uses: javipalanca/coveralls-python-action@develop
      with:
        parallel: true
        flag-name: Unit Test
    - name: Send coverage report to codecov
      uses: codecov/codecov-action@v5

  coveralls_finish:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
